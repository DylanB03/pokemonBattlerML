[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pokemon-battler"
version = "0.1.0"
description = "Training, evaluation, and Pokémon Showdown deployment for a Qwen battle policy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitsandbytes>=0.46.1,<0.50",
    "huggingface-hub>=0.27,<2",
    "lz4>=4.3.3",
    "numpy>=2.0.2",
    "peft>=0.14.0",
    "poke-env>=0.15.0,<0.16",
    "python-dotenv>=1.0,<2",
    "safetensors>=0.4.5",
    "torch>=2.4.0",
    "transformers>=4.48.0,<6",
]

[project.scripts]
pokemon-prepare = "pokemon_battler.data.prepare:main"
pokemon-inspect = "pokemon_battler.evaluation.inspect_data:main"
pokemon-train = "pokemon_battler.training.train:main"
pokemon-evaluate = "pokemon_battler.evaluation.evaluate:main"
pokemon-predict = "pokemon_battler.evaluation.predict:main"
pokemon-baseline = "pokemon_battler.evaluation.baseline:main"
pokemon-mechanics-cache = "pokemon_battler.data.mechanics_cache:main"
pokemon-mechanics-baseline = "pokemon_battler.evaluation.mechanics_baseline:main"
pokemon-run = "pokemon_battler.pipelines.experiment:main"
pokemon-interaction-run = "pokemon_battler.pipelines.interaction_experiment:main"
pokemon-live-eval = "pokemon_battler.showdown.live_eval:main"
pokemon-public-play = "pokemon_battler.showdown.public_play:main"
pokemon-win-train = "pokemon_battler.pipelines.win_experiment:main"
pokemon-distill = "pokemon_battler.training.distill:main"
pokemon-teacher-collect = "pokemon_battler.showdown.teacher_collect:main"
pokemon-preview-train = "pokemon_battler.training.preview_train:main"
pokemon-policy-suite = "pokemon_battler.evaluation.policy_suite:main"
pokemon-win-pipeline = "pokemon_battler.pipelines.win_pipeline:main"
pokemon-parallel-teacher = "pokemon_battler.showdown.parallel_teacher_collect:main"
pokemon-policy-ablation = "pokemon_battler.evaluation.policy_ablation:main"
pokemon-selective-data = "pokemon_battler.data.selective_data:main"
pokemon-frozen-cache = "pokemon_battler.data.frozen_cache:main"
pokemon-cached-distill = "pokemon_battler.training.cached_distill:main"
pokemon-gated-run = "pokemon_battler.pipelines.gated_pipeline:main"
pokemon-trajectory-prepare = "pokemon_battler.data.trajectory_prepare:main"
pokemon-trajectory-cache = "pokemon_battler.data.trajectory_cache:main"
pokemon-trajectory-train = "pokemon_battler.training.trajectory_train:main"
pokemon-trajectory-run = "pokemon_battler.pipelines.trajectory_pipeline:main"
pokemon-residual-cache = "pokemon_battler.data.residual_cache:main"
pokemon-residual-run = "pokemon_battler.pipelines.residual_pipeline:main"
pokemon-metamon-assets = "pokemon_battler.data.metamon_assets:main"
pokemon-parallel-trajectory-prepare = "pokemon_battler.data.parallel_trajectory_prepare:main"
pokemon-parallel-interaction-cache = "pokemon_battler.data.parallel_interaction_cache:main"
pokemon-structured-train = "pokemon_battler.training.structured_train:main"
pokemon-structured-blend-sweep = "pokemon_battler.evaluation.structured_blend_sweep:main"
pokemon-large-offline-run = "pokemon_battler.pipelines.large_offline_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_battler"]

[tool.ruff]
line-length = 100
target-version = "py310"
