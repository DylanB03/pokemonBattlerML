[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pokemon-battler"
version = "0.1.0"
description = "Offline-RL, self-play PPO, and evaluation harness for a Qwen Pokémon policy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitsandbytes>=0.46.1,<0.50",
    "lz4>=4.3.3",
    "numpy>=2.0.2",
    "peft>=0.14.0",
    "poke-env>=0.15.0,<0.16",
    "python-dotenv>=1.0,<2",
    "safetensors>=0.4.5",
    "torch>=2.4.0",
    "transformers>=4.48.0,<6",
]

[project.scripts]
pokemon-prepare = "pokemon_battler.prepare:main"
pokemon-inspect = "pokemon_battler.inspect_data:main"
pokemon-train = "pokemon_battler.train:main"
pokemon-evaluate = "pokemon_battler.evaluate:main"
pokemon-predict = "pokemon_battler.predict:main"
pokemon-baseline = "pokemon_battler.baseline:main"
pokemon-mechanics-cache = "pokemon_battler.mechanics_cache:main"
pokemon-mechanics-baseline = "pokemon_battler.mechanics_baseline:main"
pokemon-run = "pokemon_battler.experiment:main"
pokemon-interaction-run = "pokemon_battler.interaction_experiment:main"
pokemon-live-eval = "pokemon_battler.live_eval:main"
pokemon-public-play = "pokemon_battler.public_play:main"
pokemon-win-train = "pokemon_battler.win_experiment:main"
pokemon-distill = "pokemon_battler.distill:main"
pokemon-teacher-collect = "pokemon_battler.teacher_collect:main"
pokemon-preview-train = "pokemon_battler.preview_train:main"
pokemon-policy-suite = "pokemon_battler.policy_suite:main"
pokemon-win-pipeline = "pokemon_battler.win_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_battler"]

[tool.ruff]
line-length = 100
target-version = "py310"
